<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>رسمي</title>
  <meta name="description" content="مرجعيتك لكل خطوة في حياة شركتك">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%230f2a44'/><path d='M18 34l9 9 19-21' stroke='%231f9d74' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <header class="bar">
    <div class="bar-in">
      <a class="brand" href="#home"><span class="mark" aria-hidden="true"></span>رسمي</a>
      <button class="btn ghost hidden" id="logout" type="button">خروج</button>
      <nav class="nav" id="nav" aria-label="التنقل"></nav>
    </div>
  </header>
  <div class="preview" id="preview" hidden>
    <span>وضع التجربة:</span>
    <button type="button" data-as="admin">مدير</button>
    <button type="button" data-as="owner">صاحب عمل</button>
    <button type="button" data-as="office">مكتب</button>
    <select id="preview-office" aria-label="المكتب" hidden></select>
    <span class="preview-note">البيانات اللي تعملها هنا بتتعلّم إنها تجريبية</span>
  </div>
  <div class="pilot">نسخة تجريبية بالدعوة فقط</div>
  <main id="app" class="wrap"><div class="loading">جاري التحميل</div></main>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/core.js"></script>
  <script src="assets/admin.js"></script>
  <script src="assets/owner.js"></script>
  <script src="assets/office.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
